<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>宠物叫声图鉴</title>
<link rel="icon" href="favicon.ico" sizes="any">
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1b1d21;--dim:#6b7280;--line:#e3e6ea;--accent:#3b82f6;--ring:rgba(59,130,246,.35);--pad:20px}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--fg:#e8eaed;--dim:#9aa3af;--line:#272b33;--accent:#60a5fa;--ring:rgba(96,165,250,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);
 font:15px/1.5 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
 -webkit-text-size-adjust:100%;overscroll-behavior-y:none}
header{position:sticky;top:0;z-index:9;background:var(--bg);border-bottom:1px solid var(--line);
 padding:calc(12px + env(safe-area-inset-top)) var(--pad) 10px}
.wrap,main{max-width:1200px;margin:0 auto}
h1{margin:0 0 10px;font-size:17px;font-weight:650}
h1 span{color:var(--dim);font-weight:400;font-size:13px;margin-left:8px}
.search{display:flex;gap:10px;align-items:center}
/* font-size 必须 >=16px,否则 iOS Safari 聚焦时会自动放大页面 */
input{flex:1;min-width:0;padding:11px 14px;font-size:16px;color:var(--fg);background:var(--card);
 border:1px solid var(--line);border-radius:10px;outline:none;-webkit-appearance:none}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
main{padding:16px var(--pad) 24px}
#grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
.pet{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px 8px;
 text-align:center;cursor:pointer;user-select:none;-webkit-user-select:none;
 transition:transform .12s,border-color .12s,opacity .12s;touch-action:manipulation}
@media(hover:hover){.pet:hover{transform:translateY(-2px);border-color:var(--accent)}}
.pet:active{transform:scale(.96);border-color:var(--accent)}
.pet.playing{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
.pet.loading{opacity:.5}
.ico{width:64px;height:64px;margin:0 auto 6px;background-image:url(sprite.webp);
 background-size:1344px 1344px}
.nm{font-size:13px;font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.id{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;margin-top:1px}
.empty{color:var(--dim);text-align:center;padding:60px 0}
footer{max-width:1200px;margin:0 auto;padding:4px var(--pad) calc(28px + env(safe-area-inset-bottom));
 text-align:center;color:var(--dim);font-size:12px;line-height:1.8}
footer a{color:var(--accent);text-decoration:none}
footer a:hover{text-decoration:underline}
.pet.target{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
/* 带 hash 打开时的揭晓弹窗:一次点击既满足移动端手势要求,又不剧透是谁 */
#gate{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;
 align-items:center;justify-content:center;gap:22px;cursor:pointer;
 background:rgba(8,10,14,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
 padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
 animation:fade .18s ease-out}
#gate[hidden]{display:none}
#gate.out{animation:fade .18s ease-in reverse forwards}
.ring{width:min(46vw,168px);height:min(46vw,168px);border-radius:50%;
 border:4px solid #fff;color:#fff;display:flex;align-items:center;justify-content:center;
 font-size:min(22vw,80px);font-weight:700;line-height:1;
 box-shadow:0 0 0 0 rgba(255,255,255,.35);animation:pulse 2s ease-out infinite}
.gate-t{color:#fff;font-size:16px;font-weight:550;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.5)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.35)}
 70%{box-shadow:0 0 0 26px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
@media(prefers-reduced-motion:reduce){.ring{animation:none}#gate{animation:none}}
@media(max-width:480px){
 :root{--pad:12px}
 #grid{gap:8px;grid-template-columns:repeat(auto-fill,minmax(78px,1fr))}
 .ico{width:52px;height:52px;background-size:1092px 1092px}
 .nm{font-size:12px}
 h1{font-size:15px} h1 span{display:block;margin:2px 0 0}
}
</style></head><body>

const grid=document.getElementById('grid'),q=document.getElementById('q'),
      sub=document.getElementById('sub'),empty=document.getElementById('empty');
const small=matchMedia('(max-width:480px)');
// iOS Safari 不支持 WebM,退回 m4a/AAC
const a=new Audio();
// 只用 m4a/AAC:Chrome、Firefox、Safari/iOS、Android WebView 全部原生支持,免去格式分支
a.preload='none';                        // 每只一个小文件,点了才拉
let cur=null,timer=0;
function stop(){clearTimeout(timer);a.pause();
  if(cur){cur.classList.remove('playing','loading');cur=null}}
function play(p,el){
  const was=cur;stop();
  document.querySelectorAll('.pet.target').forEach(e=>{if(e!==el)e.classList.remove('target')});
  if(was===el)return;                    // 再次点击=停止
  cur=el;el.classList.add('playing','loading');
  // 换 src 后同步 play():整个过程都在 click 的手势栈内,iOS/WebView 均放行。
  // 不再依赖 seek —— QQ 等内置浏览器不转发 Range 时,整轨方案会退回 0 秒。
  a.src='audio/'+p.py+'.m4a';
  const pr=a.play();if(pr&&pr.catch)pr.catch(()=>{});
  timer=setTimeout(stop,((p.d||3)+1)*1000);   // ended 不触发时的兜底
}
a.addEventListener('playing',()=>{if(cur)cur.classList.remove('loading')});
a.addEventListener('ended',stop);
const seen={},vi={};
for(const p of PETS)seen[p.book]=(seen[p.book]||0)+1;
for(const p of PETS)if(seen[p.book]>1)vi[p.py]=(vi[p.book]=(vi[p.book]||0)+1);
function render(list){
  grid.replaceChildren();elMap.clear();empty.hidden=list.length>0;
  const d=small.matches?DS:D,f=document.createDocumentFragment();
  for(const p of list){
    const el=document.createElement('div');el.className='pet';
    el.title=p.name+' · 图鉴 '+p.book+' · '+p.py;
    const x=-(p.i%COLS)*d,y=-Math.floor(p.i/COLS)*d;
    el.innerHTML='<div class="ico" style="background-position:'+x+'px '+y+'px"></div>'+
      '<div class="nm">'+p.name+'</div><div class="id">#'+String(p.book).padStart(3,'0')+
      (vi[p.py]?' <span style="opacity:.7">形态'+vi[p.py]+'</span>':'')+'</div>';
    el.onclick=()=>{setHash(p);play(p,el)};
    elMap.set(p.py,el);f.appendChild(el);
  }
  grid.appendChild(f);
  sub.textContent='点击头像播放 · '+(list.length===PETS.length?'共 '+PETS.length+' 只'
                                     :list.length+' / '+PETS.length);
}
// ---- hash 路由 ----
const elMap=new Map();
const byHash=h=>{h=decodeURIComponent((h||'').replace(/^#/,'')).trim();if(!h)return null;
  const lo=h.toLowerCase();
  return PETS.find(p=>p.py.toLowerCase()===lo)||
         (/^\d+$/.test(h)?PETS.find(p=>p.book===+h):null)||null};
function setHash(p){history.replaceState(null,'','#'+p.py)}
function focusPet(p,doPlay){
  if(q.value){q.value='';filter()}          // 目标可能被搜索过滤掉
  const el=elMap.get(p.py);if(!el)return;
  el.scrollIntoView({block:'center',behavior:'smooth'});
  document.querySelectorAll('.pet.target').forEach(e=>e.classList.remove('target'));
  el.classList.add('target');
  if(doPlay)play(p,el);
}
const gate=document.getElementById('gate');
let pending=null;
function openGate(p){pending=p;gate.hidden=false;gate.classList.remove('out')}
gate.addEventListener('click',()=>{
  const p=pending;pending=null;
  gate.classList.add('out');
  setTimeout(()=>{gate.hidden=true;gate.classList.remove('out')},180);
  if(p)focusPet(p,true);                     // 仍在用户手势栈内,iOS 可正常起播
});
addEventListener('hashchange',()=>{const p=byHash(location.hash);if(p)focusPet(p,true)});

function filter(){
  const s=q.value.trim().toLowerCase();
  render(!s?PETS:PETS.filter(p=>p.name.toLowerCase().includes(s)||p.py.toLowerCase().includes(s)||
    String(p.book)===s||String(p.book).padStart(3,'0')===s||String(p.book).startsWith(s)));
}
q.addEventListener('input',filter);
q.addEventListener('keydown',e=>{if(e.key==='Escape'){q.value='';filter()}});
small.addEventListener('change',filter);   // 断点切换需重算精灵偏移
render(PETS);
const start=byHash(location.hash);
if(start)openGate(start);
